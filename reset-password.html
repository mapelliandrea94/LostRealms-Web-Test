<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password · Lost Realms</title>
<style>
:root{color-scheme:dark;font-family:Georgia,serif}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;color:#efe5cc;background:radial-gradient(ellipse at 50% 20%,#254063 0,#101d34 45%,#09101c 100%)}
.panel{width:min(100%,460px);padding:32px;border:2px solid #b79a61;border-radius:16px;background:linear-gradient(150deg,#253951,#101a29);box-shadow:0 22px 70px #0009,inset 0 0 0 4px #ffffff0a}
.crest{text-align:center;color:#efc978;font-size:38px}
h1{text-align:center;font-size:29px;color:#f5daa0;margin:12px 0}
p{line-height:1.5;text-align:center;color:#c8cdd0}
label{display:block;margin:20px 0 8px;color:#e9d19f}
input{width:100%;padding:13px;border:1px solid #a18c65;border-radius:8px;background:#0d192a;color:white;font:17px Georgia,serif}
button{width:100%;margin-top:20px;padding:14px;border:1px solid #f5d38b;border-radius:8px;background:linear-gradient(#c3a466,#836432);color:#171a20;font:bold 17px Georgia,serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:#e5bf75}
#status{min-height:48px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="panel">
<div class="crest">⚔</div>
<h1>LOST REALMS</h1>
<p>Choose a new password for your adventurer account.</p>
<form id="reset-form" hidden>
<label for="password">New password (at least 6 characters)</label>
<input id="password" type="password" minlength="6" autocomplete="new-password" required>
<button id="submit" type="submit">SAVE NEW PASSWORD</button>
</form>
<p id="status" role="status"></p>
<p><a href="./">Return to the game</a></p>
</main>
<script>
const projectUrl = "https://larrpstdcvrpvmssetbg.supabase.co";
const apiKey = "sb_publishable_CvKmzlbLpl-t4m0wudoErA_stzIVNHG";
const params = new URLSearchParams(location.hash.slice(1));
const token = params.get("access_token");
const type = params.get("type");
const error = params.get("error_description") || params.get("error");
history.replaceState(null, "", location.pathname);
const status = document.getElementById("status");
const form = document.getElementById("reset-form");
if (error) status.textContent = "This link has expired or is invalid. Request a new reset email from the game.";
else if (!token || type !== "recovery") status.textContent = "Open the latest password reset link from your email.";
else {
  form.hidden = false;
  status.textContent = "Your account is verified. Enter the new password.";
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  const password = document.getElementById("password").value;
  if (password.length < 6) return;
  const button = document.getElementById("submit");
  button.disabled = true;
  status.textContent = "Updating password...";
  try {
    const response = await fetch(projectUrl + "/auth/v1/user", {
      method: "PUT",
      headers: {"apikey": apiKey, "Authorization": "Bearer " + token, "Content-Type": "application/json"},
      body: JSON.stringify({password})
    });
    if (!response.ok) throw new Error("Reset failed. Request a new link and try again.");
    form.hidden = true;
    status.textContent = "Password updated. Return to the game and sign in with your new password.";
  } catch (err) {
    status.textContent = err.message || "Could not reach the account server.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
